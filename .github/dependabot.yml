# Dependabot: cotygodniowe PR-y z nowszymi wersjami zależności (minor i patch, jeden zbiorczy PR
# na ekosystem) oraz poprawki bezpieczeństwa z alertów, też zebrane w jeden PR.
# Wersje major są pominięte: to migracje, nie podbicia — robi się je ręcznie.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src", "/src/Gus.Regon.BIR11.Proxy", "/test/Gus.Regon.BIR11.Proxy.Itegration.Tests"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Warsaw
    groups:
      github-actions:
        patterns: ["*"]
