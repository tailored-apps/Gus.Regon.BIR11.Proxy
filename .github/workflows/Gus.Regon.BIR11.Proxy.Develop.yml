name: Gus.Regon.BIR11.Proxy develop feature/* bugfix/* Build

on:
  push:
    branches: [ develop, feature/*, bugfix/* ]
  pull_request:
    branches: [ master, develop, feature/*, bugfix/* ]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # tagi v* są bazą wersji preview
    # .NET Core 3.1 nie uruchamia się na obecnym ubuntu-latest (brak zgodnego ICU/OpenSSL),
    # dlatego SDK 10 (LTS). Biblioteka dalej celuje w netstandard2.1.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Bump version
      run: bash .github/scripts/bump-version.sh preview ./src/Gus.Regon.BIR11.Proxy/Gus.Regon.BIR11.Proxy.csproj
    - name: Install dependencies
      run: dotnet restore ./src/Gus.Regon.BIR11.sln
    - name: Build
      run: dotnet build ./src/Gus.Regon.BIR11.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test ./src/Gus.Regon.BIR11.sln --no-restore --verbosity normal
